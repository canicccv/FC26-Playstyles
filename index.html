<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>FC PlayStyles Plus Simulator</title>
    <style>
        body { background-color: #0f1215; color: #ffffff; font-family: sans-serif; padding: 20px; }

        /* 제목과 입력창 레이아웃 */
        .header-container { 
            display: flex; 
            align-items: center; 
            gap: 20px; 
            margin-bottom: 30px; 
            border-left: 5px solid #fff; 
            padding-left: 15px; 
        }
        h2 { font-size: 20px; margin: 0; text-transform: uppercase; }

        /* 이름 입력창 스타일 (형광 초록색 포인트) */
        .name-input {
            background: #1e2329;
            border: 1px solid #17DE53;
            color: #17DE53; 
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            outline: none;
            width: 200px;
            transition: 0.3s;
        }
        .name-input:focus { 
            border-color: #17DE53; 
            box-shadow: 0 0 10px rgba(23, 222, 83, 0.4); 
        }
        .name-input::placeholder { color: #444; font-weight: normal; }

        /* 리셋 버튼 스타일 */
        .btn-reset {
            background-color: #ff4444;
            color: #ffffff;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
            text-transform: uppercase;
        }
        .btn-reset:hover { background-color: #cc0000; }

        .category { margin-bottom: 20px; }
        .category-title { 
            font-size: 15px; font-weight: bold; color: #6d7278; 
            border-bottom: 1px solid #252a30; padding-bottom: 5px; margin-bottom: 10px;
        }

        .grid { display: flex; flex-wrap: wrap; gap: 5px; }

        .icon-box {
            width: 95px; display: flex; flex-direction: column; align-items: center; cursor: pointer;
            transition: 0.2s; margin-bottom: 15px;
        }

        /* 1단계: 기본 (회색) */
        .icon-img {
            width: 80px; height: 80px; object-fit: contain;
            filter: grayscale(100%) brightness(0.3);
            opacity: 0.3;
            transition: all 0.2s;
        }
        .label { margin-top: 12px; font-size: 11px; color: #6d7278; text-align: center; font-weight: 600; }

        /* 2단계: 활성화 (흰색 불) */
        .icon-box.active .icon-img {
            filter: grayscale(0%) brightness(1.2) drop-shadow(0 0 15px #fff);
            opacity: 1;
            transform: scale(1.05);
        }
        .icon-box.active .label { color: #fff; }

        /* 3단계: 플러스 (노란색/황금색 불) */
        .icon-box.gold .icon-img {
            filter: grayscale(0%) brightness(1.1) sepia(1) saturate(5) hue-rotate(10deg) drop-shadow(0 0 18px #efcc5a);
            opacity: 1;
            transform: scale(1.1);
        }
        .icon-box.gold .label { color: #efcc5a; font-weight: 800; }
    </style>
</head>
<body>

    <div class="header-container">
        <h2>PLAYSTYLE SIMULATOR</h2>
        <input type="text" class="name-input" id="player-name" placeholder="PLAYER NAME">
        <button class="btn-reset" onclick="resetAll()">리셋</button>
    </div>

    <div id="main-container"></div>

    <script>
        const categories = {
            "SCORING": ["Finesse_Shot", "Chip_Shot", "Power_Shot", "Dead_Ball", "Precision_Header", "Acrobatic",  "Low_Driven_shot", "Gamechanger" ],
            "PASSING": ["Incisive_Pass", "Pinged_Pass", "Long_Ball_Pass", "Tiki_Taka", "Whipped_Pass", "Inventive"],
            "DEFENDING": ["Jockey", "Block", "Intercept", "Anticipate", "Slide_Tackle", "Aerial_Fortress"],
            "BALL CONTROL": ["Technical", "Rapid", "First_Touch", "Trickster", "Press_Proven"],
            "PHYSICAL": ["Quick_Step", "Relentless", "Long_Throw", "Bruiser" , "Enforcer"],
            "GOALKEEPING": ["Far_Throw", "Footwork", "Cross_Claimer", "Rush_Out", "Far_Reach", "Deflector"]
        };

        const container = document.getElementById('main-container');

        Object.keys(categories).forEach(catName => {
            const section = document.createElement('div');
            section.className = 'category';
            section.innerHTML = `<div class="category-title">${catName}</div>`;
            const grid = document.createElement('div');
            grid.className = 'grid';

            categories[catName].forEach(fileName => {
                const box = document.createElement('div');
                box.className = 'icon-box';
                box.onclick = function() { changeState(this); };
                
                const displayName = fileName.replace(/_/g, ' ').toUpperCase();
                box.innerHTML = `
                    <img src="images/${fileName}.png" class="icon-img">
                    <div class="label">${displayName}</div>
                `;
                grid.appendChild(box);
            });
            section.appendChild(grid);
            container.appendChild(section);
        });

        function changeState(el) {
            if (!el.classList.contains('active') && !el.classList.contains('gold')) {
                el.classList.add('active');
            } else if (el.classList.contains('active')) {
                el.classList.remove('active');
                el.classList.add('gold');
            } else {
                el.classList.remove('gold');
            }
        }

        // 리셋 함수
        function resetAll() {
            if(confirm("모든 설정을 초기화하시겠습니까?")) {
                document.querySelectorAll('.icon-box').forEach(el => {
                    el.classList.remove('active', 'gold');
                });
                document.getElementById('player-name').value = "";
            }
        }
    </script>
</body>
</html>
