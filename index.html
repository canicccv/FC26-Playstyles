<head>

    <style>
        body { background-color: #0f1215; color: #ffffff; font-family: sans-serif; padding: 20px; }

        .header-container { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; border-left: 5px solid #fff; padding-left: 15px; }
        h2 { font-size: 20px; margin: 0; text-transform: uppercase; }

        .name-input {
            background: #1e2329; border: 1px solid #17DE53; color: #17DE53;
            padding: 8px 15px; border-radius: 5px; font-size: 16px; font-weight: bold;
            outline: none; width: 200px;
        }

        .btn-reset {
            background-color: #ff4444; color: #ffffff; border: none; padding: 8px 15px;
            border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 14px;
        }

        .category { margin-bottom: 20px; }
        .category-title { font-size: 15px; font-weight: bold; color: #6d7278; border-bottom: 1px solid #252a30; padding-bottom: 5px; margin-bottom: 10px; }

        .grid { display: flex; flex-wrap: wrap; gap: 5px; }

        .icon-box {
            width: 95px; display: flex; flex-direction: column; align-items: center; 
            cursor: pointer; position: relative; margin-bottom: 15px;
        }

        .icon-img { width: 80px; height: 80px; object-fit: contain; transition: 0.2s; }
        
        /* 0단계(꺼짐): 투명도 및 흑백 */
        .icon-box.off .icon-img { opacity: 0.13; filter: grayscale(100%); }

        .label { margin-top: 12px; font-size: 11px; color: #6d7278; text-align: center; font-weight: 600; }
        .icon-box.active .label { color: #fff; }
        .icon-box.gold .label { color: #efcc5a; }

       /* 기본 툴팁 스타일 (기존 유지) */
.tooltip {
    visibility: hidden;
    position: absolute;
    bottom: 115%;
    left: 50%;
    transform: translateX(-50%);
    background-color: rgba(0, 0, 0, 0.95);
    color: #fff;
    text-align: center;
    padding: 10px;
    border-radius: 6px;
    font-size: 12px;
    width: 210px;
    z-index: 100;
    border: 1px solid #444;
    pointer-events: none;
    line-height: 1.4;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    transition: opacity 0.2s; /* 부드러운 등장 효과 추가 */
}

/* ★ 해결 방법: 각 줄의 첫 번째 아이콘(왼쪽 정렬) 대응 */
/* 화면 왼쪽 끝에 너무 붙는 것을 방지하기 위해 왼쪽 정렬을 수정합니다 */
.grid .icon-box:nth-child(8n+1) .tooltip {
    left: 0;
    transform: translateX(0);
    text-align: left; /* 첫 번째는 왼쪽 정렬이 보기 편할 수 있습니다 */
}

/* 만약 오른쪽 끝 아이콘도 잘린다면 아래 코드를 추가하세요 (8번째 아이콘 기준) */
.grid .icon-box:nth-child(8n) .tooltip {
    left: auto;
    right: 0;
    transform: translateX(0);
    text-align: right;
}

/* 모바일 대응: 화면이 좁을 때 툴팁이 삐져나가는 것 방지 */
@media (max-width: 600px) {
    .tooltip {
        width: 160px; /* 모바일에서는 툴팁 너비를 줄임 */
        left: 50% !important;
        transform: translateX(-50%) !important;
    }
}
        /* 활성화 상태에서만 툴팁 노출 */
        .icon-box.active:hover .tooltip,
        .icon-box.gold:hover .tooltip { visibility: visible; }
        
        /* 플러스(골드) 툴팁 강조 색상 */
        .icon-box.gold .tooltip { border-color: #efcc5a; }
    </style>
</head>

            "DEFENDING": ["jockey", "block", "intercept", "anticipate", "slide_tackle", "Aerial_Fortress"],
            "BALL CONTROL": ["technical", "rapid", "first_touch", "trickster", "press_proven"],
            "PHYSICAL": ["quick_step", "relentless", "long_throw", "Bruiser", "Enforcer"],
            "GOALKEEPING": ["far_throw", "footwork", "cross_claimer", "rush_out", "far_reach", "deflector"]
        };

        const container = document.getElementById('main-container');
        let globalIndex = 0;

        Object.keys(categories).forEach(catName => {
            const section = document.createElement('div');
            section.className = 'category';
            section.innerHTML = `<div class="category-title">${catName}</div>`;
            const grid = document.createElement('div');
            grid.className = 'grid';

            categories[catName].forEach(fileName => {
                const box = document.createElement('div');
                box.className = 'icon-box off'; 
                box.dataset.id = globalIndex;
                
                const displayName = fileName.replace(/_/g, ' ').toUpperCase();
                box.dataset.name = displayName; // 이름 저장
                
                box.onclick = function() { changeState(this); };
                
                // 초기 툴팁은 Normal 설명으로 세팅 (off 상태라 보이지 않음)
                const descNormal = playstyleData[displayName]?.normal || `${displayName} 기본 설명입니다.`;

                box.innerHTML = `
                    <div class="tooltip">${descNormal}</div>
                    <img src="images/basetrait${globalIndex}.png" class="icon-img">
                    <div class="label">${displayName}</div>
                `;
                grid.appendChild(box);
                globalIndex++;
            });
            section.appendChild(grid);
            container.appendChild(section);
        });

        function changeState(el) {
            const img = el.querySelector('.icon-img');
            const tooltip = el.querySelector('.tooltip');
            const id = el.dataset.id;
            const name = el.dataset.name;
            const data = playstyleData[name] || { normal: `${name} 기본`, plus: `${name} 플러스` };

            if (el.classList.contains('off')) {
                // 0 -> 1단계 (Normal)
                el.classList.remove('off');
                el.classList.add('active');
                img.src = `images/basetrait${id}.png`;
                tooltip.innerText = data.normal; // Normal 툴팁 적용
            } else if (el.classList.contains('active')) {
                // 1 -> 2단계 (Plus)
                el.classList.remove('active');
                el.classList.add('gold');
                img.src = `images/icontrait${id}.png`;
                tooltip.innerText = data.plus; // Plus 툴팁 적용
            } else {
                // 2 -> 0단계 (Reset)
                el.classList.remove('gold');
                el.classList.add('off');
                img.src = `images/basetrait${id}.png`;
                tooltip.innerText = data.normal; // 다시 기본으로
            }
        }

        function resetAll() {
            if(confirm("모든 설정을 초기화하시겠습니까?")) {
                document.querySelectorAll('.icon-box').forEach(el => {
                    const id = el.dataset.id;
                    const name = el.dataset.name;
                    const tooltip = el.querySelector('.tooltip');
                    const normalDesc = playstyleData[name]?.normal || `${name} 기본`;

                    el.className = 'icon-box off';
                    el.querySelector('.icon-img').src = `images/basetrait${id}.png`;
                    tooltip.innerText = normalDesc;
                });
                document.getElementById('player-name').value = "";
            }
        }
    </script>
</body>
</html>
